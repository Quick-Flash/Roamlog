[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "roamlog"
version = "0.1.0"
edition = "2024"
authors = ["Kevin Plaizier"]
description = "Local-first trip recording and traveled-road history for Android"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1"
libc = "0.2"
zgui = { git = "https://github.com/Quick-Flash/zgui", rev = "8b27698b2288ec3a78fbfd659d87ce3a99b86a09", optional = true }
zgui-ui = { git = "https://github.com/Quick-Flash/zgui", rev = "8b27698b2288ec3a78fbfd659d87ce3a99b86a09", optional = true }
zgui-ui-tokens = { git = "https://github.com/Quick-Flash/zgui", rev = "8b27698b2288ec3a78fbfd659d87ce3a99b86a09", optional = true }
zgui-ui-icons = { git = "https://github.com/Quick-Flash/zgui", rev = "8b27698b2288ec3a78fbfd659d87ce3a99b86a09", optional = true }
zgui-image = { git = "https://github.com/Quick-Flash/zgui", rev = "8b27698b2288ec3a78fbfd659d87ce3a99b86a09", optional = true }
plot = { package = "zgui-plot", git = "https://github.com/Quick-Flash/zgui-plot", rev = "40757c406d0384a36434a8baf0fd3fad512b33ed", optional = true }
kurbo = { version = "0.13.1", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "jpeg"], optional = true }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
async-channel = { version = "2.5", optional = true }
tiny-skia = { version = "0.11", optional = true }
ab_glyph = { version = "0.2", optional = true }
png = { version = "0.17", optional = true }
sha2 = { version = "0.10.9", optional = true }
tempfile = "3"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"], optional = true }
base64 = { version = "0.22", optional = true }
qrcodegen = { version = "1.8", optional = true }
quircs = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }
blake3 = { version = "1.8", optional = true }
postcard = { version = "1.1", default-features = false, features = ["alloc"], optional = true }

[features]
default = ["ui"]
sharing = ["dep:iroh", "dep:tokio", "dep:base64", "dep:qrcodegen", "dep:quircs", "dep:subtle", "dep:postcard", "dep:blake3"]
ui = ["dep:zgui", "dep:zgui-ui", "dep:zgui-ui-tokens", "dep:zgui-ui-icons", "dep:zgui-image", "dep:plot", "dep:kurbo", "dep:image", "dep:ureq", "dep:async-channel", "dep:tiny-skia", "dep:ab_glyph", "dep:png", "dep:sha2"]

[lib]
crate-type = ["rlib", "cdylib"]

[patch.crates-io]
fontique = { git = "https://github.com/Quick-Flash/zgui", rev = "8b27698b2288ec3a78fbfd659d87ce3a99b86a09" }
accesskit_android = { git = "https://github.com/Quick-Flash/zgui", rev = "8b27698b2288ec3a78fbfd659d87ce3a99b86a09" }

[patch."https://github.com/zortax/zgui"]
zgui = { git = "https://github.com/Quick-Flash/zgui", rev = "8b27698b2288ec3a78fbfd659d87ce3a99b86a09" }
zgui-ui = { git = "https://github.com/Quick-Flash/zgui", rev = "8b27698b2288ec3a78fbfd659d87ce3a99b86a09" }

[dev-dependencies]
zgui-testkit-view = { git = "https://github.com/Quick-Flash/zgui", rev = "8b27698b2288ec3a78fbfd659d87ce3a99b86a09" }

[[example]]
name = "sharing_probe"
required-features = ["sharing"]

[[example]]
name = "demo_data"
required-features = ["ui"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
